name: Test Automation Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Clean and Compile Dependencies
        run: mvn clean compile test-compile -DskipTests

      - name: Install Playwright and Dependencies
        run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium"

      - name: Run Tests
        env:
          BOOKER_USERNAME: ${{ secrets.BOOKER_USERNAME || 'admin' }}
          BOOKER_PASSWORD: ${{ secrets.BOOKER_PASSWORD || 'password123' }}
        run: mvn test -Dheadless=true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin
